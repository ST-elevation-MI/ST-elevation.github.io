name: Publish capital quiz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify quiz and security policy
        run: |
          node capital-quiz/tests/quiz.test.cjs
          node capital-quiz/tests/ui.test.cjs
          node capital-quiz/tests/security.test.cjs
      - name: Build public files only
        env:
          SITE_URL: https://st-elevation-mi.github.io/ST-elevation.github.io
        run: node capital-quiz/scripts/build-site.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
